name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: pip install ruff==0.17.2 black==26.10.1
      - name: Ruff
        run: ruff check app tests
      - name: Black
        run: black --check app tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing tests/

  # The same suite on PostgreSQL. SQLite stays the default everywhere else; this job proves
  # that DATABASE_URL works with PostgreSQL (migrations, queries and the whole test suite).
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: archlens
          POSTGRES_PASSWORD: archlens
          POSTGRES_DB: archlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archlens -d archlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://archlens:archlens@localhost:5432/archlens
      TEST_DATABASE_URL: postgresql://archlens:archlens@localhost:5432/archlens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e ".[postgres]"
      - name: Migrations apply, roll back and apply again
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Run tests on PostgreSQL
        run: pytest tests/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t archlens:ci .
      - name: Smoke test container
        run: |
          docker run -d --name archlens -p 8000:8000 archlens:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ | grep -q "Example report"
      - name: Container logs
        if: always()
        run: docker logs archlens || true
