# Local PostgreSQL for trying ArchLens off SQLite. Optional: the app and the tests default to SQLite.
#
#   docker compose up -d db
#   pip install -e ".[postgres]"
#   export DATABASE_URL=postgresql://archlens:archlens@localhost:5432/archlens
#   alembic upgrade head
#   uvicorn main:app
#
# Run the test suite on it:
#   TEST_DATABASE_URL=postgresql://archlens:archlens@localhost:5432/archlens pytest
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: archlens
      POSTGRES_PASSWORD: archlens
      POSTGRES_DB: archlens
    ports:
      - "5432:5432"
    volumes:
      - archlens-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archlens -d archlens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  archlens-pgdata:
