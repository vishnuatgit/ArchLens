[project]
name = "archlens"
version = "0.1.0"
description = "Engineering health scores for public GitHub repositories: web app, REST API and CLI."
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Vishnu" }
]
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.3",
    "sqlalchemy>=2.0.31",
    "jinja2>=3.1.4",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "alembic>=1.13.1",
    "typer>=0.12.3",
    "rich>=13.7.1",
]

[project.scripts]
archlens = "app.cli:app"

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.9",
    "black>=24.4.2",
    "pre-commit>=3.7.1",
    "pyyaml>=6.0",
    "locust>=2.29",
]
# Optional: run on PostgreSQL instead of SQLite (set DATABASE_URL to a postgresql:// URL)
postgres = [
    "psycopg[binary]>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py311"]
