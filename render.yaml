# Render Blueprint: https://render.com/docs/blueprint-spec
# Free plan: the service sleeps after 15 minutes without traffic, and the SQLite
# database lives on the container's ephemeral disk, so it resets on every restart
# or redeploy. The app then reloads the bundled example reports (app/seed/examples.json).
services:
  - type: web
    name: archlens
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Fine-grained GitHub token with no repository permissions (public data only).
      # Set the value in the Render dashboard; it is never committed.
      - key: GITHUB_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: INFO
      # Render's proxy terminates HTTPS. Trusting its X-Forwarded-Proto header lets uvicorn
      # report the real https scheme, so shared report links and README badge snippets use
      # https://. Only Render's proxy can reach the container, so trusting it is safe here.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
